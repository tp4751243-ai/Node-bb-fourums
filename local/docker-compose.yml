# בית העורכים on your own computer, for testing and tweaking. Not for production (see docker/ for that).
#   ./setup.sh            first time, and any time you want to re-apply the forum structure
#   Forum:  http://localhost:4567      Test inbox (all emails the forum sends): http://localhost:8025
name: beit-haorchim-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodebb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nodebb-local}
      POSTGRES_DB: nodebb
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodebb -d nodebb"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches every email the forum sends (confirmations, notifications) so nothing leaves your computer.
  mail:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    env_file: .env
    environment:
      NODEBB_URL: http://localhost:4567
      NODEBB_PORT: "4567"
      NODEBB_DB: postgres
      NODEBB_DB_HOST: db
      NODEBB_DB_PORT: "5432"
      NODEBB_DB_USER: nodebb
      NODEBB_DB_PASSWORD: ${DB_PASSWORD:-nodebb-local}
      NODEBB_DB_NAME: nodebb
      NODEBB_DB_SSL: "false"
      # Our plugin, straight from this repository: edit it, then `docker compose restart nodebb`.
      NODEBB_ADDITIONAL_PLUGINS: /opt/plugins/nodebb-plugin-trust-tiers
    ports:
      - "127.0.0.1:4567:4567"
    volumes:
      - nodebb-config:/opt/config
      - nodebb-uploads:/usr/src/app/public/uploads
      - nodebb-build:/usr/src/app/build
      - ../plugins:/opt/plugins:ro

  # Runs the repository's scripts next to the forum (used by setup.sh).
  tools:
    image: node:22-alpine
    profiles: ["tools"]
    network_mode: "service:nodebb"
    env_file: .env
    working_dir: /repo
    volumes:
      - ../:/repo:ro

volumes:
  db-data:
  nodebb-config:
  nodebb-uploads:
  nodebb-build:
